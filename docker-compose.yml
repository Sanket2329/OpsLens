
# ---------------------------------------------------------------------------
# OpsLens — full local stack
# Usage:
#   docker compose up -d          # start everything
#   docker compose logs -f api    # stream API logs
#   docker compose down -v        # stop and remove volumes
#
# Required: copy backend/.env.example to .env in this directory and fill in:
#   GEMINI_API_KEY=...
#   JWT_SECRET=...
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opslens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opslens}
      POSTGRES_DB: ${POSTGRES_DB:-opslens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opslens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Qdrant Vector Database
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --------------------------------------------------------------------------
  # OpsLens API
  # --------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_NAME: OpsLens
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      LOG_LEVEL: INFO

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opslens}:${POSTGRES_PASSWORD:-opslens}@postgres:5432/${POSTGRES_DB:-opslens}

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents
      QDRANT_VECTOR_SIZE: 3072

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: "60"

      REDIS_URL: redis://redis:6379/0

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: "20"
      ALLOWED_EXTENSIONS: ".pdf,.txt,.md"

      WEB_CONCURRENCY: "2"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # --------------------------------------------------------------------------
  # Alembic migrations (runs once then exits)
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opslens}:${POSTGRES_PASSWORD:-opslens}@postgres:5432/${POSTGRES_DB:-opslens}
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-placeholder}
    restart: "no"

  # --------------------------------------------------------------------------
  # Redis (Message Broker for Celery & Caching)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Celery Worker
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery worker --loglevel=info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opslens}:${POSTGRES_PASSWORD:-opslens}@postgres:5432/${POSTGRES_DB:-opslens}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents
      QDRANT_VECTOR_SIZE: 3072
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:3000"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
